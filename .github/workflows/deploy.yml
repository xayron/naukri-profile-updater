name: Deploy to Lambda via S3
on:
  push:
    branches: [lambda]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-node@v3
      with:
        node-version: 18
    
    - name: Install dependencies
      run: npm install
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
    
    - name: Create deployment package
      run: zip -r deployment.zip index.js package.json node_modules/
    
    - name: Upload to S3
      run: |
        aws s3 cp deployment.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda-deployments/naukri-automation-latest.zip
    
    - name: Update Lambda function
      run: |
        aws lambda update-function-code \
          --function-name naukri-automation \
          --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
          --s3-key lambda-deployments/naukri-automation-latest.zip
